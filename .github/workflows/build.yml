name: Build Age Calculator APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
      
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython
      
      - name: Clean cache
        run: |
          rm -rf .buildozer bin
      
      # ⬇️ هذا هو السطر السحري الذي يحل مشكلة sdkmanager ⬇️
      - name: Fix SDK Manager path
        run: |
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/tools/bin
          echo '#!/bin/bash' > $HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          echo 'exec $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager "$@"' >> $HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          chmod +x $HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
      
      - name: Build APK
        run: buildozer android debug
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: age-calculator-apk
          path: bin/*.apk
