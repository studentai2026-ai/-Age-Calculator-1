name: Build Age Calculator APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          workdir: .
          buildozer_version: stable
          # هذا الخيار يجبر الإجراء على استخدام صورة Docker محددة بدلاً من "latest"
          # لتجنب مشاكل السحب التي واجهناها سابقاً
          docker_image: kivy/buildozer:1.5.0

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: age-calculator-apk
          path: ${{ steps.buildozer.outputs.filename }}
