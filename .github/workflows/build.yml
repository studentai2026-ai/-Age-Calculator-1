name: Build Age Calculator APK
on: [push, workflow_dispatch]
- name: Clean Buildozer cache
  run: |
    rm -rf .buildozer bin

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Verify Python version
        run: |
          python --version
          which python
          # يجب أن يظهر Python 3.11.x
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
      
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython
          # تأكد من أن buildozer المثبت يستخدم Python 3.11
          which buildozer
      
      - name: Build APK
        run: buildozer android debug
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: age-calculator-apk
          path: bin/*.apk

